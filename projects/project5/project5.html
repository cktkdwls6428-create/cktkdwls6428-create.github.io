<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Hyundai Cortina Modeling | Project Detail</title>
    <style>
        body { background-color: #0b0b0b; color: #fff; padding: 50px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        .back-btn { color: #8aa4b7; text-decoration: none; font-size: 14px; transition: color 0.2s; }
        .back-btn:hover { color: #ffffff; }
        .video-wrapper { max-width: 1000px; margin: 40px auto; aspect-ratio: 16/9; background-color: #000; border-radius: 6px; overflow: hidden; }
        .description { max-width: 1000px; margin: 20px auto; line-height: 1.6; }
        
        /* ★ 화질 안내 문구 스타일 ★ */
        .quality-notice {
            max-width: 1000px;
            margin: 0 auto 30px auto;
            text-align: right; /* 영상 우측 하단 플레이어 설정 버튼 위치에 맞게 우측 정렬 */
            font-size: 12px;
            color: #888888;
            letter-spacing: -0.3px;
        }

        .quality-notice span {
            color: #8aa4b7;
            font-weight: bold;
        }

        .description { max-width: 1000px; margin: 20px auto; line-height: 1.6; }
        
        
        /* 갤러리 섹션 스타일 */
        .project-gallery {
            max-width: 1000px;
            margin: 50px auto 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px; /* 이미지 간의 정갈한 간격 */
        }
        
        .gallery-item {
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            background-color: #111;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .gallery-item p {
            font-size: 13px;
            color: #666;
            margin-top: 10px;
            text-align: left;
        }
    </style>
</head>
<body>
    <a href="../../index.html" class="back-btn">← Back to Works</a>
    
    <div class="video-wrapper">
        <!-- 유튜브 주소 파라미터 중복 오타(?si=...와 ?rel=...) 수정 완료 -->
        <iframe width="1920" height="1080" src="https://www.youtube.com/embed/HuNZTfG1a94?si=w5TiMNHbrRH7_WDE"?rel=0&modestbranding=1" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen
                style="width:100%; height:100%;">
        </iframe>
    </div>

    <div class="quality-notice">
        💡 고화질 감상을 위해 플레이어 우측 상단 <span>[설정 ⚙️] → [화질]</span>에서 1080p을 선택해 주세요.
    </div>

    <div class="description">
        <hr style="border: 0; border-top: 1px solid #222; margin: 40px 0;">
    
        <h1>Samsung Dotcom YouMake</h1>
    

        <p style="color: #8aa4b7; margin-bottom: 20px;">
        shading & texturing , animation , compositing , solo project
        </p>

     

        <h3>Description</h3>
        <p style="color: #aaa; line-height: 1.8;">
        새로운 광고주 삼성닷컴 건을 전 인원이 합심한 시안으로 채택되면서 저는 그 시안에 맞는 제품과 카메라 무빙을 직접 구성하고 제작했습니다.

        </p>

        <!-- ★ 사진 갤러리 섹션 시작 ★ -->
        <div class="project-gallery">
            <hr style="border: 0; border-top: 1px solid #222; margin: 20px 0 10px 0;">
            <h3 style="margin-bottom: 10px;">Output</h3>

            <!-- 첫 번째 이미지 -->
            <div class="gallery-item">
                <img src="../../thumbnail/KakaoTalk_20260911_153229296_01.webp" alt="Cortina Still 1">
                <!-- 이미지 설명글이 필요 없으시면 아래 <p> 태그는 지우셔도 됩니다 -->
                
            </div>

            <!-- 두 번째 이미지 (사진 추가시 아래 덩어리를 복사해서 쓰시면 됩니다) -->
            <div class="gallery-item">
                <img src="../../thumbnail/KakaoTalk_20260911_153229296_02.webp" alt="Cortina Still 2">
            </div>

            <!-- 세 번째 이미지 (사진 추가시 아래 덩어리를 복사해서 쓰시면 됩니다) -->
            <div class="gallery-item">
                <img src="../../thumbnail/KakaoTalk_20260911_153229296_03.webp" alt="Cortina Still 3">
            </div>

        </div>
        <!-- ★ 사진 갤러리 섹션 끝 ★ -->

    </div>
