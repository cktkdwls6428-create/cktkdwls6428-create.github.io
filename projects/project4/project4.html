<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung 360 3D Renderings</title>
    <style>
        body { 
            background-color: #0b0b0b; 
            color: #fff; 
            padding: 50px 20px; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .back-btn { 
            color: #8aa4b7; 
            text-decoration: none; 
            font-size: 14px; 
            transition: color 0.2s; 
        }
        .back-btn:hover { color: #ffffff; }

        .description { 
            margin: 30px 0 50px 0; 
            line-height: 1.6; 
        }

        /* ★ 핵심: 바둑판식(Grid) 비디오 갤러리 레이아웃 ★ */
        .grid-gallery {
            display: grid;
            /* PC: 한 줄에 3개씩 균등 배치 (화면 크기에 따라 자동) */
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px; /* 카드와 카드 사이의 정갈한 여백 */
            margin-top: 30px;
        }

        .grid-card {
            background-color: #141414;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #222222;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        /* 마우스 올렸을 때 살짝 뜨는 연출 */
        .grid-card:hover {
            transform: translateY(-5px);
            border-color: #444444;
        }

        /* 비디오 & GIF 16:9 고정 비율 */
        .media-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            overflow: hidden;
        }

        .media-wrapper video,
        .media-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-info {
            padding: 15px;
        }

        .card-info h4 {
            font-size: 15px;
            margin: 0 0 5px 0;
            color: #ffffff;
        }

        .card-info p {
            font-size: 12px;
            margin: 0;
            color: #8aa4b7;
        }

        /* 모바일 반응형: 화면이 좁아지면 한 줄에 1개씩 세로로 정렬 */
        @media (max-width: 768px) {
            .grid-gallery {
                grid-template-columns: repeat(1, 1fr);
                gap: 25px;
            }
        }
        
        /* square 클래스가 붙은 박스는 1:1 정사각형 비율로 고정 */
        .media-wrapper.square {
            aspect-ratio: 1 / 1;
        }

        /* 정사각형(square) 안의 GIF/이미지는 잘림 없이 전체 원본 비율 유지 */
        .media-wrapper.square img,
        .media-wrapper.square video {
            object-fit: contain; /* cover(잘림) 대신 contain(원본 전체 보여주기) 적용 */
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../index.html" class="back-btn">← Back to Works</a>

        <div class="description">
            <hr style="border: 0; border-top: 1px solid #222; margin: 30px 0;">
            <h1>Samsung 360 3D Renderings</h1>
        

        
            <p style="color: #aaa; line-height: 1.8;">
                신제품 출시전 3D 렌더링을 활용한 360도 회전 영상 제작 프로젝트입니다. 모델 당 여러개의 색상이 존재하기에 단기간에 여려개의 영상을 뽑아내야 합니다. <br>
            </p>
        </div>

        <!-- ★ 바둑판식 영상 갤러리 시작 ★ -->
        <div class="grid-gallery">

            <!-- 비디오 카드 1 (MP4 영상 방식 - 강추) -->
            <div class="grid-card">
                <div class="media-wrapper square">
                    <img src="../../thumbnail/project4_gif1.gif" alt="GIF Loop">
                </div>
                <div class="card-info">
                    <h4>Galaxy Watch7 360</h4>
                    <p>2024</p>
                </div>
            </div>

            <!-- 비디오 카드 2 (GIF 방식도 가능) -->
            <div class="grid-card">
                <div class="media-wrapper square">
                    <img src="../../thumbnail/project4_gif2.gif" alt="GIF Loop">
                </div>
                <div class="card-info">
                    <h4>Galaxy Watch8 Ultra 360</h4>
                    <p>2025</p>
                </div>
            </div>

            <!-- 비디오 카드 3 -->
            <div class="grid-card">
                <div class="media-wrapper square">
                    <img src="../../thumbnail/project4_gif3.gif" alt="GIF Loop">
                </div>
                <div class="card-info">
                    <h4>Galaxy S25FE 360</h4>
                    <p>2026</p>
                </div>
            </div>

            </div>

            <!-- ★ 필요하신 만큼 아래로 <div class="grid-card">...</div> 세트를 복사해서 늘려주세요! -->

        </div>
        <!-- ★ 바둑판식 영상 갤러리 끝 ★ -->

    </div>
</body>
</html>
